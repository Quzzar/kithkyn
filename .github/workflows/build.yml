name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          java-version: '21'
          distribution: temurin
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - uses: gradle/actions/setup-gradle@v6.4.0
      - run: ./gradlew check build
      - run: python3 tools/release/audit-catalogs.py build/libs
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: kithkyn-jars
          path: build/libs/*.jar
          if-no-files-found: error

  production-smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          java-version: '21'
          distribution: temurin
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v8.0.1
        with:
          name: kithkyn-jars
          path: release-jars
      - name: Clean server, all catalogs, real model download and shutdown
        run: python tools/release/smoke-server.py --jar release-jars --directory smoke-without-curios --accept-eula
      - name: Download optional Curios integration
        shell: bash
        run: curl --fail --location --output curios.jar 'https://maven.theillusivec4.top/top/theillusivec4/curios/curios-neoforge/9.5.1+1.21.1/curios-neoforge-9.5.1+1.21.1.jar'
      - name: Clean server with Curios installed
        run: python tools/release/smoke-server.py --jar release-jars --directory smoke-with-curios --curios curios.jar --disable-llm --accept-eula --timeout 900
      - name: Preserve smoke logs and evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: production-smoke-${{ matrix.os }}
          path: |
            smoke-*/production-smoke.log
            smoke-*/installer.log
            smoke-*/verification.json
            smoke-*/crash-reports/
          if-no-files-found: warn
